worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Sticky Sessions für WebSockets bei mehreren App-Instanzen (pulse + pulse-b)
    upstream pulse_app {
        ip_hash;
        server pulse:3000 max_fails=2 fail_timeout=10s;
        server pulse-b:3000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Für TLS: Zertifikate nach deploy/certs/ legen und das HTTPS-Server-Block aktivieren.
        # return 301 https://$host$request_uri;

        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://pulse_app;
        }

        location /.well-known/acme-challenge/ {
            proxy_pass http://pulse_app;
            proxy_set_header Host $host;
        }

        location / {
            # Komplette URI inkl. ?h= Content-Hash-Query an die App — kein $args-Stripping.
            proxy_pass http://pulse_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # server {
    #     listen 443 ssl http2;
    #     server_name pulse.example.stadt.de;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     location / {
    #         proxy_pass http://pulse_app;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection $connection_upgrade;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 3600s;
    #     }
    # }
}
